name: Bug Report
description: Report something that is broken in Agent Burn for Windows
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing Agent Burn for Windows. Every report is read.

        **Never paste tokens or credential files** (`.credentials.json`, `auth.json`): the app never needs them to debug a report.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Be specific. Include error messages and a screenshot if you can.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Minimal steps to trigger the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: false

  - type: input
    id: version
    attributes:
      label: App version
      description: Shown at the bottom right of the window, e.g. 0.5.4
    validations:
      required: true

  - type: input
    id: windows
    attributes:
      label: Windows version
      description: e.g. Windows 11 24H2
    validations:
      required: false

  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - Windows only
        - WSL
        - Both
    validations:
      required: true

  - type: input
    id: harnesses
    attributes:
      label: Harnesses involved
      description: e.g. Claude Code, Codex, OpenCode (and the WSL distro, if any)
    validations:
      required: false
