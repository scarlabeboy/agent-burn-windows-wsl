name: Idea or Feature Request
description: Suggest a change or a new feature for Agent Burn for Windows
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Keep this short and concrete. For a change to the CLI itself, the upstream project is
        [Melvynx/agent-burn](https://github.com/Melvynx/agent-burn).

  - type: textarea
    id: what
    attributes:
      label: What would you like?
      description: Be specific and concise.
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: Why?
      description: What problem does this solve for you?
    validations:
      required: true
