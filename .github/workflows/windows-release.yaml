# Builds Agent Burn Windows on a GitHub Windows runner and drafts its release: the signed NSIS
# installer, its updater signature and latest.json. Run it by hand (Actions > Windows release >
# Run workflow) once the version and its CHANGELOG.md section are pushed; then review the draft
# and publish it. A draft is not "latest", so no installed app sees it before it is published.
# The tag v<version> is created by the action with GITHUB_TOKEN, which starts no other workflow.
# Actions are pinned to a commit: this job gets the key that signs every update, so a tag moved
# in another repository must not be able to change what runs here. Update a pin on purpose.
name: Windows release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No later step pushes with git: the release goes through the API with GITHUB_TOKEN.
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      # The same toolchain as rust-toolchain.toml at the repository root.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.96.0"

      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            rust -> target
            desktop/src-tauri -> target

      - name: Build the Agent Burn CLI (sidecar)
        run: ./desktop/scripts/prepare-cli.ps1

      - name: Install the app dependencies
        working-directory: desktop
        run: npm ci

      - name: Tests
        working-directory: desktop
        run: |
          npm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --manifest-path src-tauri/Cargo.toml

      - name: Release notes from CHANGELOG.md
        id: notes
        run: |
          $notes = (./desktop/scripts/release-notes.ps1) -join "`n"
          "body<<CHANGELOG_NOTES" >> $env:GITHUB_OUTPUT
          $notes >> $env:GITHUB_OUTPUT
          "CHANGELOG_NOTES" >> $env:GITHUB_OUTPUT

      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: desktop
          tagName: v__VERSION__
          releaseName: Agent Burn Windows __VERSION__ (bêta)
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          prerelease: false
