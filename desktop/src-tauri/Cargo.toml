[package]
name = "agent-burn-windows"
version = "0.1.0"
edition = "2021"
description = "Agent Burn for Windows: Windows, WSL and combined Computer views"

[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
memchr = "2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
